name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: is-edustack-prezentace
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Chybí tajné klíče CLOUDFLARE_API_TOKEN a CLOUDFLARE_ACCOUNT_ID (účet petr@petrvich.work). Nastav je: gh secret set CLOUDFLARE_API_TOKEN -R edustack-is/is-edustack-prezentace"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure Pages project exists
        run: npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch main || true

      - name: Deploy
        run: npx --yes wrangler@4 pages deploy . --project-name "$PROJECT_NAME" --branch main --commit-hash "$GITHUB_SHA"
